name: GCP Checker
run-name: ${{ github.actor }} is checking PAN-OS versions on GCP
on:
  workflow_dispatch:
  # A dry run on pull requests: the full job against the live APIs, minus
  # the commit, so a dependency or code change is proven before merge and
  # Renovate's branches are never written to.
  pull_request:
    paths:
      - "gcp-processing.py"
      - "panos_*.py"
      - ".github/workflows/gcp-actions.yml"
  schedule:
    - cron: "30 */6 * * *"

# All three checkers rewrite data/versions.json, so they take turns rather
# than racing each other to push. Shared by name across the three workflows.
# GitHub keeps only one run waiting per group: a third arrival cancels the
# one already waiting. Runs take a minute or two against 15-minute gaps, so
# on the schedule this does not happen; a cancelled run is simply retried at
# its next slot. Dispatching all three by hand at once will cancel one.
# Pull request runs commit nothing, so they get a group of their own and
# never hold up or cancel a scheduled run; a newer push supersedes them.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.ref) || 'data-commit' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  panos-checker:
    permissions:
      contents: write
    name: "panos-checker"
    # Pull requests from forks get no secrets, so there is nothing to run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        # The branch name, so a queued run builds on the newest push rather
        # than the commit it was triggered from. On a pull request the ref is
        # N/merge, not a branch, so the default merge checkout is used.
        with:
          ref: ${{ github.event_name != 'pull_request' && github.ref_name || '' }}

      # Pinned so the interpreter does not change under the scripts whenever
      # GitHub moves ubuntu-latest to a new image.
      - uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97" # v7.0.0
        with:
          python-version: "3.12"

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093" # v3.0.0
        with:
          credentials_json: "${{ secrets.GCP_CREDS }}"

      # Install gcloud, `setup-gcloud` automatically picks up authentication from `auth` task above
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db" # v3.0.1

      - name: "Get GCP PAN-OS base images lists"
        run: |-
          gcloud compute images list --project paloaltonetworksgcp-public --no-standard-images --format="value(NAME)" --filter="name~'vmseries'" > gcp-list.txt

      - name: "Get GCP Panorama base images lists"
        run: |-
          gcloud compute images list --project paloaltonetworksgcp-public --no-standard-images --format="value(NAME)" --filter="name~'panorama'" > gcp-rama-list.txt

      - name: "Get GCP Prisma AIRS base images lists"
        run: |-
          gcloud compute images list --project paloaltonetworksgcp-public --no-standard-images --format="value(NAME)" --filter="name~'ai-runtime-security'" > gcp-airs-list.txt

      - name: Run GCP post-processing
        run: |-
          python gcp-processing.py gcp-list.txt gcp-rama-list.txt gcp-airs-list.txt

      - name: Show what would be committed
        if: github.event_name == 'pull_request'
        run: git status --short gcp.md data/

      - name: Commit and Push
        if: github.event_name != 'pull_request'
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gcp.md data/
          timestamp=$(date -u)
          git commit -m "Latest data: ${timestamp}" || exit 0
          git pull --rebase
          git push
