name: GCP Checker
run-name: ${{ github.actor }} is checking PAN-OS versions on GCP
on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"

# All three checkers rewrite data/versions.json, so they take turns rather
# than racing each other to push. Shared by name across the three workflows.
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  panos-checker:
    permissions:
      contents: write
    name: "panos-checker"

    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      # Pinned so the interpreter does not change under the scripts whenever
      # GitHub moves ubuntu-latest to a new image.
      - uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97" # v7.0.0
        with:
          python-version: "3.12"

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093" # v3.0.0
        with:
          credentials_json: "${{ secrets.GCP_CREDS }}"

      # Install gcloud, `setup-gcloud` automatically picks up authentication from `auth` task above
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db" # v3.0.1

      - name: "Get GCP PAN-OS base images lists"
        run: |-
          gcloud compute images list --project paloaltonetworksgcp-public --no-standard-images --format="value(NAME)" --filter="name~'vmseries'" > gcp-list.txt

      - name: "Get GCP Panorama base images lists"
        run: |-
          gcloud compute images list --project paloaltonetworksgcp-public --no-standard-images --format="value(NAME)" --filter="name~'panorama'" > gcp-rama-list.txt

      - name: "Get GCP Prisma AIRS base images lists"
        run: |-
          gcloud compute images list --project paloaltonetworksgcp-public --no-standard-images --format="value(NAME)" --filter="name~'ai-runtime-security'" > gcp-airs-list.txt

      - name: Run GCP post-processing
        run: |-
          python gcp-processing.py gcp-list.txt gcp-rama-list.txt gcp-airs-list.txt

      - name: Commit and Push
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gcp.md data/
          timestamp=$(date -u)
          git commit -m "Latest data: ${timestamp}" || exit 0
          git pull --rebase
          git push
