name: AWS Checker
run-name: ${{ github.actor }} is checking PAN-OS versions on AWS
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

# All three checkers rewrite data/versions.json, so they take turns rather
# than racing each other to push. Shared by name across the three workflows.
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  panos-checker:
    permissions:
      contents: write
    name: "panos-checker"

    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/checkout@v7"
        with:
          ref: ${{ github.ref_name }}

      # Pinned so the interpreter does not change under the scripts whenever
      # GitHub moves ubuntu-latest to a new image.
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Run AWS processing
        run: |-
          pip install -r requirements.txt
          python aws-processing.py

      - name: Commit and Push
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aws.md aws/ data/
          timestamp=$(date -u)
          git commit -m "Latest data: ${timestamp}" || exit 0
          git pull --rebase
          git push
